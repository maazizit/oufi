<title>Maquette Oufi Sécurité</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  color-scheme:light;
  --bg:#F4F6F9; --surface:#ffffff; --surface-2:#EDF1F6; --surface-3:#E2EAF3;
  --ink:#0E1B2A; --ink-2:#3C4E62; --muted:#6C7D91;
  --line:#DCE3EC; --line-2:#C2CEDC;
  --navy:#0E3A63; --navy-2:#15507F; --on-navy:#EAF2FB; --navy-line:#24537F;
  --blue:#1668B8; --blue-ink:#0F4E8C; --blue-soft:#E5EFFA;
  --ok:#0F7A5A; --ok-soft:#E2F3EC;
  --warn:#8A5800; --warn-soft:#FAEED8;
  --dan:#B02A20; --dan-soft:#FBE8E6;
  --sh-1:0 1px 2px rgba(14,27,42,.07);
  --sh-2:0 2px 4px rgba(14,27,42,.05),0 12px 28px rgba(14,27,42,.09);
  --r:10px; --r-s:7px; --r-l:16px;
  --ff-lat:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,sans-serif;
  --ff-ar:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif;
  --ff:var(--ff-lat);
  --ff-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0A1521; --surface:#10202F; --surface-2:#17293A; --surface-3:#1F3448;
  --ink:#E9EFF6; --ink-2:#B6C5D5; --muted:#8699AD;
  --line:#22394E; --line-2:#31495F;
  --navy:#0C2B45; --navy-2:#154466; --on-navy:#DCE9F6; --navy-line:#254C6E;
  --blue:#4E9EE8; --blue-ink:#8CC2F2; --blue-soft:#132B42;
  --ok:#4FC79E; --ok-soft:#0E3129;
  --warn:#E0A64A; --warn-soft:#33260F;
  --dan:#F0827A; --dan-soft:#3A1A18;
  --sh-1:0 1px 2px rgba(0,0,0,.4);
  --sh-2:0 2px 4px rgba(0,0,0,.35),0 12px 28px rgba(0,0,0,.45);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0A1521; --surface:#10202F; --surface-2:#17293A; --surface-3:#1F3448;
  --ink:#E9EFF6; --ink-2:#B6C5D5; --muted:#8699AD;
  --line:#22394E; --line-2:#31495F;
  --navy:#0C2B45; --navy-2:#154466; --on-navy:#DCE9F6; --navy-line:#254C6E;
  --blue:#4E9EE8; --blue-ink:#8CC2F2; --blue-soft:#132B42;
  --ok:#4FC79E; --ok-soft:#0E3129;
  --warn:#E0A64A; --warn-soft:#33260F;
  --dan:#F0827A; --dan-soft:#3A1A18;
  --sh-1:0 1px 2px rgba(0,0,0,.4);
  --sh-2:0 2px 4px rgba(0,0,0,.35),0 12px 28px rgba(0,0,0,.45);
}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--ff);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
[dir="rtl"]{--ff:var(--ff-ar)}
h1,h2,h3,h4{margin:0;text-wrap:balance;line-height:1.18;font-weight:600;letter-spacing:-.015em}
h1{font-size:clamp(28px,4.6vw,46px);font-weight:700}
h2{font-size:clamp(21px,2.6vw,30px)}
h3{font-size:18px}
p{margin:0}
a{color:inherit}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--ff-mono);font-variant-numeric:tabular-nums;unicode-bidi:plaintext}
.num{font-variant-numeric:tabular-nums;unicode-bidi:plaintext}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--blue-ink)}
.muted{color:var(--muted)}
.ink2{color:var(--ink-2)}
.sm{font-size:13px}
.xs{font-size:12px}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- demo bar ---------- */
.demobar{background:#081D31;color:#CFE2F3;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding-block:9px;padding-inline:16px;font-size:12.5px;border-bottom:1px solid #12354F}
.demobar .tag{background:#F2C14E;color:#2A1D00;font-weight:700;font-size:10.5px;letter-spacing:.09em;padding:3px 7px;border-radius:4px}
.demobar .grow{flex:1 1 40px}
.seg{display:inline-flex;background:#0F2C46;border:1px solid #1C4463;border-radius:8px;padding:2px;gap:2px}
.seg button{background:none;border:0;color:#A9C6E0;padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12.5px;font-weight:500}
.seg button[aria-pressed="true"]{background:#1668B8;color:#fff}
.demobar .lnk{background:none;border:1px solid #1C4463;color:#A9C6E0;padding:5px 10px;border-radius:7px;cursor:pointer;font-size:12.5px}
.demobar .lnk:hover{border-color:#2E6795;color:#E4F0FA}

/* ---------- shared atoms ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:var(--r-s);padding:9px 16px;font-size:14px;font-weight:500;cursor:pointer;background:var(--surface-2);color:var(--ink);text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--surface-3)}
.btn-pri{background:var(--blue);color:#fff}
.btn-pri:hover{background:var(--blue-ink)}
.btn-navy{background:var(--navy);color:var(--on-navy)}
.btn-navy:hover{background:var(--navy-2)}
.btn-out{background:transparent;border-color:var(--line-2);color:var(--ink)}
.btn-out:hover{background:var(--surface-2)}
.btn-dan{background:transparent;border-color:var(--line-2);color:var(--dan)}
.btn-dan:hover{background:var(--dan-soft)}
.btn-sm{padding:6px 11px;font-size:13px}
.btn-lg{padding:12px 22px;font-size:15.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1)}
.pad{padding:18px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill-new{background:var(--blue-soft);color:var(--blue-ink)}
.pill-ok{background:var(--ok-soft);color:var(--ok)}
.pill-warn{background:var(--warn-soft);color:var(--warn)}
.pill-dan{background:var(--dan-soft);color:var(--dan)}
.pill-mute{background:var(--surface-2);color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--blue);color:var(--blue-ink)}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.tag-soft{display:inline-block;background:var(--surface-2);color:var(--ink-2);border-radius:5px;padding:2px 7px;font-size:11.5px}
.rule{height:1px;background:var(--line);border:0;margin:0}

/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.lab{font-size:13px;font-weight:600;color:var(--ink-2)}
.hint{font-size:12px;color:var(--muted)}
.input,.select,.textarea{width:100%;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-s);padding:9px 11px;font-size:14px}
.textarea{min-height:92px;resize:vertical}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-s);padding:11px 13px;cursor:pointer}
.opt:hover{border-color:var(--blue)}
.opt[data-on="1"]{border-color:var(--blue);background:var(--blue-soft);box-shadow:inset 0 0 0 1px var(--blue)}
.opt input{margin-top:3px;accent-color:var(--blue)}
.opt .t{font-weight:600;font-size:14px}
.err{color:var(--dan);font-size:12.5px}
.input[data-bad="1"],.select[data-bad="1"]{border-color:var(--dan)}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:start;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 13px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 13px;border-bottom:1px solid var(--line);vertical-align:middle}
td.mono,td>.mono{white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr[data-click]{cursor:pointer}
tbody tr[data-click]:hover{background:var(--surface-2)}

/* ---------- client site ---------- */
.site{display:flex;flex-direction:column;min-height:60vh}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--surface);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hdr-in{max-width:1180px;margin-inline:auto;padding-inline:16px;padding-block:11px;display:flex;align-items:center;gap:12px 14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex:0 0 auto}
.brand .mk{width:34px;height:34px;border-radius:8px;background:var(--navy);display:grid;place-items:center;color:#fff;flex:0 0 auto}
.brand .nm{font-weight:700;font-size:16px;letter-spacing:-.02em;line-height:1.1}
.brand .sl{font-size:10.5px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.nav{display:flex;gap:2px;margin-inline-start:auto;flex-wrap:wrap}
.nav button{background:none;border:0;padding:7px 11px;border-radius:7px;cursor:pointer;font-size:14px;color:var(--ink-2)}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{color:var(--blue-ink);font-weight:600;background:var(--blue-soft)}
.cartbtn{position:relative}
@media(max-width:760px){.brand{flex:1 1 auto;min-width:0}.nav{order:3;width:100%;margin-inline-start:0;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}.nav button{white-space:nowrap}}
.cartbtn .cnt{position:absolute;top:-4px;inset-inline-end:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--dan);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.wrap{max-width:1180px;margin-inline:auto;padding-inline:16px;width:100%}
.sec{padding-block:clamp(38px,6vw,64px)}
.sec-h{display:flex;flex-direction:column;gap:8px;margin-bottom:26px;max-width:62ch}

.hero{background:linear-gradient(180deg,var(--surface) 0%,var(--surface) 55%,var(--bg) 100%);border-bottom:1px solid var(--line)}
.hero-g{display:grid;grid-template-columns:minmax(0,1.02fr) minmax(0,.98fr);gap:38px;align-items:center;padding-block:clamp(30px,5vw,58px)}
.hero p.lead{font-size:clamp(15px,1.5vw,17px);color:var(--ink-2);max-width:56ch}
.hero .cta{display:flex;flex-wrap:wrap;gap:10px}
.feebar{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 32%,transparent);border-radius:var(--r-s);padding:11px 13px;font-size:13px;color:var(--ink-2)}
.feebar b{color:var(--ink)}
.plan{width:100%;height:auto;border:1px solid var(--line);border-radius:var(--r-l);background:var(--surface);box-shadow:var(--sh-2)}
@media(max-width:860px){.hero-g{grid-template-columns:1fr;gap:26px}}

.svc{display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));gap:14px}
.svc .card{display:flex;flex-direction:column;gap:9px;padding:18px}
.svc .ic{width:40px;height:40px;border-radius:9px;background:var(--blue-soft);color:var(--blue-ink);display:grid;place-items:center}
.svc ul{margin:0;padding-inline-start:18px;color:var(--ink-2);font-size:13.5px;display:flex;flex-direction:column;gap:3px}
.svc .from{margin-top:auto;padding-top:10px;border-top:1px dashed var(--line);font-size:13px;color:var(--muted)}
.svc .from b{color:var(--ink);font-size:15px}

.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:14px;counter-reset:s}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;position:relative;display:flex;flex-direction:column;gap:6px}
.step .n{font-family:var(--ff-mono);font-size:12px;color:#fff;background:var(--navy);width:24px;height:24px;border-radius:6px;display:grid;place-items:center}
.step h3{font-size:15.5px}
.step p{font-size:13.5px;color:var(--ink-2)}

.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.pcard .art{aspect-ratio:4/3;background:var(--surface-2);display:grid;place-items:center;border-bottom:1px solid var(--line);max-width:100%}
.pcard .bd{padding:12px 13px;display:flex;flex-direction:column;gap:5px;flex:1}
.pcard .bd .br{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pcard .nm{font-weight:600;font-size:14px;line-height:1.3}
.pcard .pr{font-weight:700;font-size:16px;margin-top:auto;padding-top:6px}
.pcard .acts{display:flex;gap:6px;padding:0 13px 13px}
.pcard .acts .btn{flex:1}

.filters{display:flex;flex-direction:column;gap:16px}
.catalog{display:grid;grid-template-columns:230px minmax(0,1fr);gap:22px;align-items:start}
@media(max-width:820px){.catalog{grid-template-columns:1fr}}
.fbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.fbox h4{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
.frow{display:flex;flex-wrap:wrap;gap:6px}

.footer{background:var(--navy);color:var(--on-navy);margin-top:auto}
.footer a{color:#B9D6F0}
.footer-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:26px;padding-block:38px}
.footer h4{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:#8FB6D8;margin-bottom:10px;font-weight:600}
.footer .li{font-size:13.5px;color:#D5E6F5;display:block;padding-block:3px}
.footer .bot{border-top:1px solid var(--navy-line);padding-block:14px;font-size:12px;color:#8FB6D8;display:flex;flex-wrap:wrap;gap:8px 16px}

/* ---------- drawer / modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(8,20,32,.5);z-index:80;display:flex;justify-content:flex-end}
.scrim.center{align-items:center;justify-content:center;padding:16px}
.drawer{width:min(420px,100%);background:var(--bg);height:100%;display:flex;flex-direction:column;box-shadow:var(--sh-2)}
.modal{width:min(720px,100%);max-height:min(88vh,860px);background:var(--bg);border-radius:var(--r-l);display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--sh-2)}
.dhead{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.dhead h3{flex:1;font-size:16px}
.dbody{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.dfoot{border-top:1px solid var(--line);background:var(--surface);padding:13px 16px;display:flex;gap:10px;flex-wrap:wrap}
.x{background:none;border:0;cursor:pointer;color:var(--muted);font-size:20px;line-height:1;padding:4px 8px;border-radius:6px}
.x:hover{background:var(--surface-2);color:var(--ink)}

.line{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);padding:10px}
.line .art{width:54px;height:54px;border-radius:6px;background:var(--surface-2);display:grid;place-items:center;flex:0 0 auto}
.qty{display:inline-flex;border:1px solid var(--line-2);border-radius:6px;overflow:hidden}
.qty button{background:var(--surface);border:0;width:28px;height:28px;cursor:pointer;color:var(--ink-2)}
.qty button:hover{background:var(--surface-2);color:var(--ink)}
.qty span{min-width:30px;display:grid;place-items:center;font-size:13.5px;border-inline:1px solid var(--line-2);font-variant-numeric:tabular-nums}

/* ---------- admin ---------- */
.admin{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:78vh;background:var(--bg)}
.side{background:var(--navy);color:var(--on-navy);display:flex;flex-direction:column;gap:4px;padding:16px 12px}
.side .bd{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;border-bottom:1px solid var(--navy-line);margin-bottom:10px}
.side .bd .mk{width:32px;height:32px;border-radius:8px;background:#fff;color:var(--navy);display:grid;place-items:center}
.side .bd .nm{font-weight:700;font-size:14.5px;line-height:1.15}
.side .bd .sl{font-size:10.5px;color:#8FB6D8;letter-spacing:.06em;text-transform:uppercase}
.side nav{display:flex;flex-direction:column;gap:2px}
.side nav button{display:flex;align-items:center;gap:10px;background:none;border:0;color:#C3DBF0;padding:9px 11px;border-radius:7px;cursor:pointer;font-size:14px;text-align:start;width:100%}
.side nav button:hover{background:var(--navy-2);color:#fff}
.side nav button[aria-current="page"]{background:#fff;color:var(--navy);font-weight:600}
.side nav .b{margin-inline-start:auto;background:var(--dan);color:#fff;font-size:11px;font-weight:700;border-radius:9px;padding:1px 6px;min-width:18px;text-align:center}
.side nav button[aria-current="page"] .b{background:var(--dan)}
.side .ft{margin-top:auto;font-size:11.5px;color:#7FA8CC;padding:10px 8px 0;border-top:1px solid var(--navy-line)}
@media(max-width:820px){
  .admin{grid-template-columns:1fr}
  .side{flex-direction:row;align-items:center;gap:8px;overflow-x:auto;padding:10px 12px}
  .side .bd,.side .ft{display:none}
  .side nav{flex-direction:row;gap:6px}
  .side nav button{white-space:nowrap;padding:7px 12px}
}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{background:var(--surface);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:30}
.topbar h2{font-size:19px;flex:0 0 auto}
.topbar .sp{flex:1 1 20px}
.bell{position:relative;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer}
.bell .cnt{position:absolute;top:-5px;inset-inline-end:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--dan);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.who{display:flex;align-items:center;gap:9px;font-size:13px}
.who .av{width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:12.5px;font-weight:600}
.content{padding:20px;display:flex;flex-direction:column;gap:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:13px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px;display:flex;flex-direction:column;gap:3px;border-top:3px solid var(--blue)}
.kpi.k-warn{border-top-color:var(--warn)}.kpi.k-ok{border-top-color:var(--ok)}.kpi.k-dan{border-top-color:var(--dan)}
.kpi .l{font-size:12.5px;color:var(--muted)}
.kpi .v{font-size:29px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;color:var(--ink-2)}
.panes{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:900px){.panes{grid-template-columns:1fr}}
.pane{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.pane>header{padding:13px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.pane>header h3{font-size:14.5px;flex:1}
.pane .bd{padding:15px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar .search{flex:1 1 180px;min-width:150px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;font-size:13.5px;align-items:baseline}
.kv dt{color:var(--muted);white-space:nowrap}
.kv dd{margin:0;color:var(--ink)}
.tl{display:flex;flex-direction:column;gap:0;margin:0;padding:0;list-style:none}
.tl li{display:grid;grid-template-columns:auto 1fr;gap:11px;padding-bottom:13px;position:relative}
.tl li::before{content:"";position:absolute;inset-inline-start:5px;top:14px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child{padding-bottom:0}
.tl li:last-child::before{display:none}
.tl .dot{width:12px;height:12px;border-radius:50%;background:var(--line-2);margin-top:4px;z-index:1;border:2px solid var(--surface)}
.tl li[data-on="1"] .dot{background:var(--blue)}
.tl .t{font-size:13.5px;font-weight:600}
.tl .m{font-size:12px;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:9px;height:130px;padding-top:6px}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:5px;text-align:center}
.bars .b i{display:block;background:var(--blue);border-radius:3px 3px 0 0;min-height:3px}
.bars .b em{font-style:normal;font-size:11px;color:var(--muted)}
.bars .b b{font-size:12px;font-variant-numeric:tabular-nums}
.notif{position:absolute;inset-inline-end:0;top:calc(100% + 8px);width:min(330px,88vw);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-2);z-index:60;overflow:hidden}
.notif .it{padding:11px 13px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px;cursor:pointer;text-align:start;background:none;border-inline:0;border-top:0;width:100%}
.notif .it:hover{background:var(--surface-2)}
.notif .it[data-unread="1"]{background:var(--blue-soft)}
.bellwrap{position:relative}

.toasts{position:fixed;inset-block-end:16px;inset-inline-end:16px;z-index:200;display:flex;flex-direction:column;gap:9px;max-width:min(340px,92vw)}
.toast{background:var(--navy);color:var(--on-navy);border-radius:var(--r-s);padding:11px 14px;box-shadow:var(--sh-2);font-size:13.5px;display:flex;gap:9px;align-items:flex-start;animation:tin .25s ease}
.toast b{display:block;font-size:13.5px}
.toast .m{font-size:12.5px;color:#B9D6F0}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.note{background:var(--blue-soft);border:1px solid color-mix(in srgb,var(--blue) 28%,transparent);border-radius:var(--r-s);padding:12px 14px;font-size:13.5px;color:var(--ink-2)}
.ok-box{background:var(--ok-soft);border:1px solid color-mix(in srgb,var(--ok) 34%,transparent);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px}
.stepper{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.stepper .s{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:7px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.stepper .s b{width:20px;height:20px;border-radius:50%;background:var(--surface-3);color:var(--ink-2);display:grid;place-items:center;font-size:11.5px}
.stepper .s[data-on="1"]{border-color:var(--blue);color:var(--blue-ink);background:var(--blue-soft)}
.stepper .s[data-on="1"] b{background:var(--blue);color:#fff}
.stepper .s[data-done="1"] b{background:var(--ok);color:#fff}
.recap{background:var(--surface-2);border-radius:var(--r-s);padding:13px 15px}
.stat{display:flex;gap:26px;flex-wrap:wrap}
.stat div{display:flex;flex-direction:column}
.stat .v{font-size:26px;font-weight:700;letter-spacing:-.02em}
.stat .l{font-size:12.5px;color:var(--muted)}
</style>

/* helpers */
const pad=n=>(n<10?"0":"")+n;
const D=s=>new Date(s);
const fmtD=s=>{const d=D(s);return pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+d.getFullYear();};
const fmtT=s=>{const d=D(s);return pad(d.getHours())+"h"+pad(d.getMinutes());};
const fmtDT=s=>fmtD(s)+" · "+fmtT(s);
const TODAY="2026-09-27";
const isToday=s=>String(s).slice(0,10)===TODAY;
const feeFor=city=>{const f=db.settings.fees.find(x=>x[0]===city);return f?f[1]:null;};
const prod=id=>db.products.find(p=>p.id===id);
const cartCount=()=>db.cart.reduce((a,l)=>a+l.q,0);
const cartTotal=()=>db.cart.reduce((a,l)=>{const p=prod(l.id);return a+(p?p.price*l.q:0);},0);

}

}

function harvest(){
 document.querySelectorAll("[data-f]").forEach(function(el){
  const k=el.getAttribute("data-f");
  if(el.type==="checkbox")ui.form[k]=el.checked;
  else if(el.type==="radio"){if(el.checked)ui.form[k]=el.value;}
  else ui.form[k]=el.value;
 });
}
function render(){
 harvest();
 document.documentElement.setAttribute("lang",LANG);
 document.documentElement.setAttribute("dir",LANG==="ar"?"rtl":"ltr");
 const app=document.getElementById("app");
 app.innerHTML=demoBar()+(ui.mode==="client"
  ?'<div class="site">'+clientHeader()+"<main>"+clientPage()+"</main>"+clientFooter()+"</div>"
  :adminShell(adminBody(),adminTitle()));
 document.getElementById("layer").innerHTML=
  ui.cartOpen?cartDrawer():ui.openProd?productModal():ui.openReq?reqModal():ui.editProd?prodModal():ui.delProd?delModal():"";
 if(ui.focus){const el=document.querySelector(ui.focus);if(el){el.focus();try{el.setSelectionRange(el.value.length,el.value.length);}catch(e){}}}
}

/* ============================================================
   10. Actions
   ============================================================ */
const nowStamp=()=>{const d=new Date();return TODAY+"T"+pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds());};
function newRef(){const n=db.seq++;return "DEV-2026-"+("000"+n).slice(-4);}
function validate(step){
 ui.errors={};
 const need=k=>{const v=fv(k);if(v===""||v==null||v===false)ui.errors[k]=t("err_req");};
 if(step===1){need("type");need("desc");}
 if(step===2){need("city");need("addr");}
 if(step===3||step==="cart"){
  need("name");need("chan");
  if(step==="cart")need("city");
  if(fv("chan")==="mail"){if(!/^[^@\s]+@[^@\s]+\.[A-Za-z]{2,}$/.test(fv("email")))ui.errors.email=t("err_mail");}
  else if(fv("chan")){if(!/^[\d\s+().-]{9,}$/.test(fv("phone")))ui.errors.phone=t("err_phone");}
  if(!fv("ok"))ui.errors.ok=t("err_req");
 }
 return Object.keys(ui.errors).length===0;
}
function submit(src){
 const now=nowStamp(),f=ui.form;
 const r={ref:newRef(),src:src,type:src==="cart"?"prod":(f.type||"install"),svc:f.svc||"",status:"new",created:now,
  name:f.name||"",company:f.company||"",city:f.city||"",addr:f.addr||"",local:f.local||"",surface:f.surface||"",
  rooms:f.rooms||"",cams:f.cams||"",place:f.place||"",net:f.net||"",exist:f.exist||"",delay:f.delay||"",budget:f.budget||"",
  chan:f.chan||"phone",phone:f.phone||"",email:f.email||"",slot:f.slot||"any",fee:feeFor(f.city),
  desc:f.desc||"",tech:"",items:src==="cart"?db.cart.slice():[],notes:[],tl:[{at:now,k:"created"}]};
 const n=src==="cart"?cartCount():0;
 db.requests.unshift(r);
 db.notifs.unshift({id:"n"+Date.now(),at:now,ref:r.ref,read:false,
  txt:{fr:"Nouvelle demande de "+r.name+(src==="cart"?" — panier de "+n+" article(s)":" — "+t("nav_quote")),
       ar:"طلب جديد من "+r.name+(src==="cart"?" — سلة من "+n+" منتج":"")}});
 if(src==="cart")db.cart=[];
 ui.lastRef=r.ref;ui.form={};ui.errors={};ui.step=1;ui.page="confirm";
 save();render();toast(t("cf_t"),r.ref);
}
function addToCart(id,inst){
 const l=db.cart.find(x=>x.id===id);
 if(l)l.q++;else db.cart.push({id:id,q:1,inst:!!inst});
 const p=prod(id);ui.openProd=null;ui.modInst=false;save();render();toast(t("added"),p?L(p.name):"");
}
function doTrack(){
 const el=document.getElementById("trackq");
 const q=(el?el.value:ui.track).trim();ui.track=q;
 if(!q){ui.trackRes=undefined;return render();}
 const n=q.toLowerCase().replace(/[\s().-]/g,"");
 ui.trackRes=db.requests.find(r=>r.ref.toLowerCase()===q.toLowerCase()||(r.phone&&r.phone.replace(/[\s().-]/g,"")===n))||null;
 render();
}
function copyText(v,k){
 const done=()=>{ui.copied=k;render();setTimeout(()=>{ui.copied="";render();},1800);};
 try{navigator.clipboard.writeText(v).then(done).catch(done);}catch(e){done();}
}
function setStatus(ref,st){
 const r=db.requests.find(x=>x.ref===ref);if(!r||r.status===st)return;
 r.status=st;(r.tl=r.tl||[]).push({at:nowStamp(),k:"status",v:st});
 save();render();toast(t("a_statusup"),ref+" · "+t(statusOf(st).k));
}
function readSpecs(txt){
 return txt.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{
  const i=l.indexOf(":");return i<0?[l,""]:[l.slice(0,i).trim(),l.slice(i+1).trim()];});
}
function saveProduct(id){
 const g=x=>{const e=document.getElementById(x);return e?e.value.trim():"";};
 ui.errors={};
 if(!g("pf_ref"))ui.errors.pf_ref=t("err_req");
 if(!g("pf_nfr"))ui.errors.pf_nfr=t("err_req");
 if(!g("pf_price")||isNaN(+g("pf_price")))ui.errors.pf_price=t("err_req");
 if(Object.keys(ui.errors).length)return render();
 const data={ref:g("pf_ref"),cat:g("pf_cat"),brand:g("pf_brand")||"—",
  name:{fr:g("pf_nfr"),ar:g("pf_nar")||g("pf_nfr")},price:+g("pf_price"),stock:+g("pf_stock")||0,
  warr:+g("pf_warr")||0,specs:readSpecs(g("pf_specs")),active:document.getElementById("pf_pub").checked};
 if(id&&id!=="new"&&prod(id))Object.assign(prod(id),data);
 else db.products.unshift(Object.assign({id:"p"+Date.now(),pop:50},data));
 ui.editProd=null;ui.errors={};save();render();toast(t("a_saved"),data.name.fr);
}
function saveSettings(){
 const g=x=>{const e=document.getElementById(x);return e?e.value.trim():"";};
 const s=db.settings;
 s.company=g("s_company")||s.company;
 if(LANG==="ar")s.tagline.ar=g("s_tag");else s.tagline.fr=g("s_tag");
 s.phone=g("s_phone");s.whatsapp=g("s_wa");s.email=g("s_mail");
 if(LANG==="ar")s.address.ar=g("s_addr");else s.address.fr=g("s_addr");
 if(LANG==="ar")s.hours.ar=g("s_hours");else s.hours.fr=g("s_hours");
 s.sla=+g("s_sla")||24;
 save();render();toast(t("a_settings_saved"),s.company);
}

/* ============================================================
   11. Événements
   ============================================================ */
document.addEventListener("click",function(ev){
 const stop=ev.target.closest("[data-stop]");
 const el=ev.target.closest("[data-act]");
 if(!el){if(ui.notifOpen&&!stop){ui.notifOpen=false;render();}return;}
 const a=el.getAttribute("data-act"),id=el.getAttribute("data-id"),v=el.getAttribute("data-v"),ref=el.getAttribute("data-ref");
 const nav=["go","cart","prod","add","closelayer","mode","lang","reset","ago","areq"];
 if(el.tagName==="A"||nav.indexOf(a)>=0)ev.preventDefault();
 ui.focus=null;
 switch(a){
  case "mode":ui.mode=v;ui.notifOpen=false;window.scrollTo(0,0);render();break;
  case "lang":LANG=LANG==="ar"?"fr":"ar";save();render();break;
  case "reset":resetDemo();break;
  case "go":ui.page=el.getAttribute("data-page");ui.cartOpen=false;ui.errors={};if(ui.page==="quote")ui.step=1;window.scrollTo(0,0);render();break;
  case "quotesvc":ui.form.svc=el.getAttribute("data-svc");ui.form.type="install";ui.page="quote";ui.step=1;window.scrollTo(0,0);render();break;
  case "cart":ui.cartOpen=!ui.cartOpen;render();break;
  case "closelayer":if(ev.target.closest("[data-stop]")&&ev.target!==el&&el.className!=="x"&&!el.classList.contains("btn"))return;
    ui.cartOpen=false;ui.openProd=null;ui.openReq=null;ui.editProd=null;ui.delProd=null;ui.errors={};render();break;
  case "prod":ui.openProd=id;ui.modInst=false;render();break;
  case "add":addToCart(id,ui.modInst);break;
  case "qp":{const l=db.cart.find(x=>x.id===id);if(l)l.q++;save();render();break;}
  case "qm":{const l=db.cart.find(x=>x.id===id);if(l){l.q--;if(l.q<1)db.cart=db.cart.filter(x=>x.id!==id);}save();render();break;}
  case "crm":db.cart=db.cart.filter(x=>x.id!==id);save();render();break;
  case "cartclear":db.cart=[];save();render();break;
  case "qnext":if(validate(ui.step)){ui.step++;window.scrollTo(0,0);}else toast(t("err_fix"),"");render();break;
  case "qback":ui.step--;ui.errors={};render();break;
  case "qsend":if(validate(3))submit("form");else{toast(t("err_fix"),"");render();}break;
  case "csend":if(validate("cart"))submit("cart");else{toast(t("err_fix"),"");render();}break;
  case "track":doTrack();break;
  case "gotrack":ui.page="track";ui.track=v;window.scrollTo(0,0);doTrack();break;
  case "copy":copyText(v,el.getAttribute("data-k"));break;
  case "quickmsg":toast(t("cf_t"),t("cf_24",{chan:t("ch_phone"),contact:db.settings.phone}));break;
  case "fcat":ui.filters.cat=v;render();break;
  case "fbrand":ui.filters.brand=v;render();break;
  case "fclear":ui.filters={cat:"",brand:"",max:5000,inonly:false,q:"",sort:"pop"};render();break;
  case "ago":ui.aPage=el.getAttribute("data-p");ui.notifOpen=false;ui.aFilters.q="";window.scrollTo(0,0);render();break;
  case "ast":ui.aFilters.status=v;render();break;
  case "areq":ui.openReq=ref;render();break;
  case "notif":ui.notifOpen=!ui.notifOpen;render();break;
  case "readall":db.notifs.forEach(n=>n.read=true);save();render();break;
  case "opennotif":{const n=db.notifs.find(x=>x.id===id);if(n)n.read=true;ui.notifOpen=false;ui.mode="admin";ui.aPage="requests";ui.openReq=ref;save();render();break;}
  case "newprod":ui.editProd="new";ui.errors={};render();break;
  case "editprod":ui.editProd=id;ui.errors={};render();break;
  case "askdel":ui.delProd=id;render();break;
  case "dodel":{const p=prod(id);db.products=db.products.filter(x=>x.id!==id);ui.delProd=null;save();render();toast(t("a_deleted"),p?L(p.name):"");break;}
  case "saveprod":saveProduct(id);break;
  case "addnote":{const r=db.requests.find(x=>x.ref===ref),el2=document.getElementById("rnote");
    if(r&&el2&&el2.value.trim()){(r.notes=r.notes||[]).push({at:nowStamp(),txt:el2.value.trim()});save();render();toast(t("a_noteadded"),ref);}break;}
  case "planiv":{const r=db.requests.find(x=>x.ref===ref);if(!r)break;
    const d=new Date();const when=TODAY+"T"+pad((d.getHours()+1)%24)+":00:00";
    db.interv.unshift({id:"TCK-0"+(452+db.interv.length),ref:r.ref,client:r.name+(r.company?" — "+r.company:""),city:r.city,
     obj:{fr:t(typeOf(r.type).k)+" — "+r.city,ar:t(typeOf(r.type).k)+" — "+r.city},when:when,tech:r.tech||db.settings.techs[0],state:"sched"});
    if(r.status==="new"||r.status==="contacted")setStatus(r.ref,"visit");
    ui.openReq=null;ui.aPage="interv";save();render();toast(t("a_plan"),r.ref);break;}
  case "ivdone":{const i=db.interv.find(x=>x.id===id);if(i)i.state="done";save();render();break;}
  case "addfee":{const c=document.getElementById("nf_city"),f=document.getElementById("nf_fee");
    if(c&&c.value.trim()){db.settings.fees.push([c.value.trim(),+((f&&f.value)||0)]);save();render();}break;}
  case "rmfee":db.settings.fees.splice(+el.getAttribute("data-i"),1);save();render();break;
  case "savesettings":saveSettings();break;
 }
});
document.addEventListener("input",function(ev){
 const el=ev.target,a=el.getAttribute&&el.getAttribute("data-act");
 if(a==="fq"){ui.filters.q=el.value;ui.focus='[data-act="fq"]';render();}
 else if(a==="aq"){ui.aFilters.q=el.value;ui.focus='[data-act="aq"]';render();}
 else if(a==="fmax"){ui.filters.max=+el.value;ui.focus='[data-act="fmax"]';render();}
});
document.addEventListener("change",function(ev){
 const el=ev.target,a=el.getAttribute&&el.getAttribute("data-act");
 if(a==="fsort"){ui.filters.sort=el.value;render();return;}
 if(a==="finstock"){ui.filters.inonly=el.checked;render();return;}
 if(a==="asrc"){ui.aFilters.src=el.value;render();return;}
 if(a==="modinst"){ui.modInst=el.checked;return;}
 if(a==="cinst"){const l=db.cart.find(x=>x.id===el.getAttribute("data-id"));if(l)l.inst=el.checked;save();return;}
 if(a==="stock"){const p=prod(el.getAttribute("data-id"));if(p)p.stock=Math.max(0,+el.value||0);save();render();return;}
 if(a==="pub"){const p=prod(el.getAttribute("data-id"));if(p)p.active=el.checked;save();render();return;}
 if(a==="fee"){db.settings.fees[+el.getAttribute("data-i")][1]=+el.value||0;save();return;}
 if(a==="chan"){db.settings.channels[el.getAttribute("data-id")]=el.checked;save();render();return;}
 if(a==="setstatus"){setStatus(el.getAttribute("data-ref"),el.value);return;}
 if(a==="settech"){const r=db.requests.find(x=>x.ref===el.getAttribute("data-ref"));if(r){r.tech=el.value;save();render();}return;}
 if(el.hasAttribute&&el.hasAttribute("data-f")){
  harvest();
  const k=el.getAttribute("data-f");
  if(el.type==="radio"||el.type==="checkbox"||k==="city"||k==="chan"){ui.errors={};render();}
 }
});
document.addEventListener("keydown",function(ev){
 if(ev.key==="Escape"){if(ui.cartOpen||ui.openProd||ui.openReq||ui.editProd||ui.delProd||ui.notifOpen){
  ui.cartOpen=false;ui.openProd=null;ui.openReq=null;ui.editProd=null;ui.delProd=null;ui.notifOpen=false;render();}}
 if(ev.key==="Enter"&&ev.target.id==="trackq"){ev.preventDefault();doTrack();}
});

/* ============================================================
   12. Démarrage
   ============================================================ */
db=fresh();
load();
render();
})();
</script>
